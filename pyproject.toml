[project]
name = "reg-intel"
version = "0.1.0"
description = "Auditable regulatory-obligation extraction for Indian banks/insurers (step 1: RBI Master Directions)"
requires-python = ">=3.10"
dependencies = ["requests", "beautifulsoup4", "openai"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["reg_intel"]
